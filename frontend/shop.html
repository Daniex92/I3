<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - Raíz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="index.html" class="logo">🌿 RAÍZ</a>
      <div class="nav-menu">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="shop.html" class="nav-link active">Tienda</a>
        <a href="cart.html" class="nav-link">Carrito <span class="cart-count">0</span></a>
        <a href="admin.html" class="nav-link">Administración</a>
      </div>
      <button class="mobile-menu-toggle">☰</button>
    </div>
  </nav>

  <div class="container shop-container">
    <aside class="filters">
      <h3>Filtros</h3>
      
      <div class="filter-group">
        <label>Categoría</label>
        <select id="categoryFilter">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Subcategoría</label>
        <select id="subcategoryFilter">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Precio</label>
        <input type="number" id="minPrice" placeholder="Mín" class="filter-input">
        <input type="number" id="maxPrice" placeholder="Máx" class="filter-input">
      </div>

      <div class="filter-group">
        <label>Búsqueda</label>
        <input type="text" id="searchInput" placeholder="Buscar..." class="filter-input">
      </div>

      <div class="filter-group">
        <label>Ordenar</label>
        <select id="sortFilter">
          <option value="newest">Más recientes</option>
          <option value="price-asc">Precio (menor)</option>
          <option value="price-desc">Precio (mayor)</option>
        </select>
      </div>

      <button id="applyFilters" class="btn btn-primary btn-block">Aplicar Filtros</button>
    </aside>

    <main class="shop-main">
      <div class="products-grid" id="productsGrid">
        <!-- Products loaded by JavaScript -->
      </div>
    </main>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 RAÍZ. Lujo Orgánico & Artesanía Contemporánea</p>
    </div>
  </footer>

  <div id="toast-container"></div>
  <script src="js/services/api.js" type="module"></script>
  <script src="js/utils.js" type="module"></script>
  <script src="js/shop.js" type="module"></script>
</body>
</html>
